        slot: 10
        material: "PLAYER_HEAD"
        name: "&e&l%player%"
        lore:
          - "&7Ping: &a%ping% ms"
          - "&7Mundo: &f%world%"
          - "&7Modo Vuelo: &f%fly_status%"
          - "&7Modo Invisible: &f%vanish_status%"
