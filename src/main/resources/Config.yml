      # Efectos
      speed:
        slot: 16
        material: "SUGAR"
        name: "&b&lVelocidad II"
        lore:
          - "&7Corre velozmente por todo el hub."
          - ""
          - "&eClick para activar / desactivar"
        action: "COSMETIC_SPEED"

      jump:
        slot: 19
        material: "RABBIT_FOOT"
        name: "&a&lSuper Salto II"
        lore:
          - "&7Salta mucho más alto en el hub."
          - ""
