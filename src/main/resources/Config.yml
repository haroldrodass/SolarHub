#########################################################
#                                                       #
#                       Solar Hub                       #
#                                                       #
#                        Github:                        #
#        https://github.com/haroldrodass/SolarHub       #
#                                                       #
#########################################################
#
# GUÍA RÁPIDA
#
#  - true / false activa o desactiva una función.
#  - NO cambies los nombres de las claves (lo de la izquierda de los ":"),
#    solo los valores. Respeta las mayúsculas y minúsculas.
#  - Los nombres de sonidos, partículas y bloques deben escribirse en
#    MAYÚSCULAS con guiones bajos, tal como aparecen en la documentación
#    de Paper (Sound, Particle y Material).
#  - Los mensajes de texto se editan en Messages.yml, no aquí.
#  - Después de editar, usa el comando de recarga o reinicia el servidor.
#########################################################

################################################
#                                              #
#                     Spawn                    #
#                                              #
################################################
# Punto de aparición principal. Se usa en /spawn, /hub y al entrar al server.
# NO es necesario editarlo a mano: entra al juego, párate donde quieras
# el spawn y usa el comando de establecer spawn del plugin.

Spawn:
  Set: true          # Indica si ya hay un spawn definido. Si es false, se muestra "No Spawn set".
  World: "world"     # Nombre EXACTO del mundo donde está el spawn.
  X: 0.0             # Coordenadas del spawn.
  Y: 0.0
  Z: 0.0
  Yaw: 0.0           # Rotación horizontal (hacia dónde mira el jugador).
  Pitch: 0.0         # Rotación vertical (arriba/abajo).

################################################
#                                              #
#                     Redes                    #
#                                              #
################################################
# Enlaces mostrados por los comandos /discord y /website.
# Se insertan en los mensajes de Messages.yml (%link-discord% y %link-website%).

Discord:
  Enabled: true                          # false = el comando /discord se desactiva.
  Link: "https://discord.gg/rnEphVbhn6"  # Enlace de invitación.

Website:
  Enabled: true                                      # false = el comando /website se desactiva.
  Link: "https://github.com/haroldrodass/SolarHub"   # Enlace de tu página web.

################################################
#                                              #
#                  Features                    #
#                                              #
################################################

Announcements:
  enabled: true
  timer: 120         # in seconds
  sound: ENTITY_EXPERIENCE_ORB_PICKUP

# Comando /vanish para ocultarse de otros jugadores.
Vanish:
  enabled: true

# Título que aparece en pantalla al entrar al servidor.
# El texto se configura en Messages.yml (Welcome-Title y Welcome-Subtitle).
# Los tiempos van en SEGUNDOS y aceptan decimales (0.5 = medio segundo).
Welcome-Title:
  enabled: true
  Time:
    Appearance: 1   # Cuánto tarda en aparecer (fade in).
    Duration: 1       # Cuánto tiempo permanece visible por completo.
    fading: 1       # Cuánto tarda en desvanecerse (fade out).

# Doble salto: el jugador presiona espacio dos veces en el aire para
# impulsarse de nuevo.
DoubleJump:
  enabled: true
  power: 0.5                  # Fuerza del impulso hacia adelante.
  height: 1.5                 # Fuerza del impulso hacia arriba.
  Sound: ENTITY_BAT_TAKEOFF   # Sonido al saltar. Escribe NONE si no quieres sonido (ver nota).
  particle:
    enabled: true             # Mostrar partículas al saltar.
    type: CLOUD               # Tipo de partícula (CLOUD, FLAME, HEART, etc.).
    Visible-For-Everyone: true  # true = todos las ven; false = solo el jugador que salta.

# Plataforma de lanzamiento: al pisar el bloque configurado, el jugador
# sale disparado.
LaunchPad:
  enabled: true
  block: SLIME_BLOCK          # Bloque que actúa como plataforma. Ej: SLIME_BLOCK, IRON_BLOCK, GOLD_BLOCK.
  power: 1.0                  # Fuerza del impulso hacia adelante.
  height: 1.0                 # Fuerza del impulso hacia arriba.
  Sound: ENTITY_FIREWORK_ROCKET_LAUNCH  # Sonido al lanzar.
  particle:
    enabled: true
    type: FLAME
    Visible-For-Everyone: true

################################################
#                                              #
#                   Parkour                    #
#                                              #
################################################
Parkour:
  enabled: true
  start-material: "LIGHT_WEIGHTED_PRESSURE_PLATE"
  checkpoint-material: "HEAVY_WEIGHTED_PRESSURE_PLATE"

################################################
#                                              #
#                  Scoreboard                  #
#                                              #
################################################
Scoreboard:
  enabled: true
  update-interval: 20   # ticks entre actualizaciones (20 ticks = 1 segundo)

################################################
#                                              #
#                 Cooldowns                    #
#                                              #
################################################
# Tiempos de espera (en segundos) para comandos y habilidades.
# Pon 0 para desactivar el cooldown de cualquier opción.
# Los jugadores con el permiso 'Solar.CooldownBypass' ignoran todos los cooldowns.

Cooldowns:
  # Doble Salto (en segundos)
  DoubleJump: 5
  DoubleJump-Message: true     # Enviar mensaje al jugador si intenta saltar en cooldown

  # LaunchPad (en segundos)
  LaunchPad: 2
  LaunchPad-Message: false     # Enviar mensaje al pisar un launchpad en cooldown (false para evitar spam)

  # Cooldowns para comandos (en segundos)
  Commands:
    default: 0                 # Cooldown por defecto para comandos no listados (0 = sin cooldown)
    spawn: 5
    discord: 3
    website: 3
    fly: 3
    vanish: 3
    buildmode: 3
    setspawn: 5
    solarhub: 3
    servers: 2
    cosmetics: 2
    profile: 2
  HotbarItem: 0.3              # Cooldown para usar ítems de la hotbar (anti-spam de clicks)

################################################
#                                              #
#                   Hotbar                     #
#                                              #
################################################
# Objetos que se entregan al jugador al entrar al lobby.
# Slots disponibles: 0 al 8 (la barra de acceso rápido).
# Acciones disponibles:
#   MENU:<nombre>      - Abre un menú de la sección Menus (ej: MENU:servers)
#   COMMAND:<comando>  - Ejecuta un comando como el jugador (ej: COMMAND:spawn)
#   CONSOLE:<comando>  - Ejecuta un comando desde la consola (ej: CONSOLE:say Hola)
#   MESSAGE:<mensaje>  - Envía un mensaje directo al jugador
#   VISIBILITY         - Alterna entre mostrar y ocultar jugadores
#   CLOSE              - Cierra cualquier menú abierto

Hotbar:
  enabled: true
  clear-inventory: true        # Limpiar el inventario del jugador antes de entregar los ítems
  give-on-join: true           # Entregar ítems al conectarse al servidor
  give-on-respawn: true        # Entregar ítems al reaparecer
  give-on-world-change: true   # Entregar ítems al cambiar de mundo
  sound: "ITEM_ARMOR_EQUIP_GENERIC" # Sonido al recibir los ítems (NONE para desactivar)
  visibility-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"

  items:
    selector:
      slot: 0
      material: "COMPASS"
      name: "&b&lSelector de Modalidades &7(Click)"
      lore:
        - "&7Haz click derecho para abrir"
        - "&7el menú de modalidades."
      glow: true
      action: "MENU:servers"

    cosmetics:
      slot: 2
      material: "NETHER_STAR"
      name: "&d&lCosméticos &7(Click)"
      lore:
        - "&7Haz click derecho para equipar"
        - "&7efectos, partículas y sombreros."
      glow: true
      action: "MENU:cosmetics"

    spawn:
      slot: 4
      material: "ENDER_PEARL"
      name: "&6&lSpawn &7(Click)"
      lore:
        - "&7Haz click derecho para"
        - "&7regresar al punto de inicio."
      glow: false
      action: "COMMAND:spawn"

    visibility:
      slot: 6
      action: "VISIBILITY"
      visible:
        material: "LIME_DYE"
        name: "&aJugadores: &lVISIBLES &7(Click)"
        lore:
          - "&7Haz click derecho para"
          - "&7ocultar a todos los jugadores."
        glow: true
      hidden:
        material: "GRAY_DYE"
        name: "&cJugadores: &lOCULTOS &7(Click)"
        lore:
          - "&7Haz click derecho para"
          - "&7hacer visibles a los jugadores."
        glow: false

    profile:
      slot: 8
      material: "PLAYER_HEAD"
      name: "&e&lMi Perfil &7(Click)"
      lore:
        - "&7Haz click derecho para ver"
        - "&7tu información y ajustes."
      glow: false
      action: "MENU:profile"

################################################
#                                              #
#                    Menus                     #
#                                              #
################################################
# Menús interactivos tipo cofre configurables.
# Placeholders automáticos: %player%, %ping%, %world%, %fly_status%, %vanish_status%, %visibility_status%

Menus:
  # Selector de modalidades
  servers:
    title: "&8Selector de Modalidades"
    rows: 3                    # Cantidad de filas (1 a 6)
    sound: "BLOCK_CHEST_OPEN"
    filler:
      enabled: true
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "
    items:
      survival:
        slot: 11
        material: "GRASS_BLOCK"
        name: "&a&lSurvival Custom"
        lore:
          - "&7Explora nuestro mundo survival"
          - "&7con protecciones, economía y misiones."
          - ""
          - "&e▶ Click para conectar"
        action: "CONNECT:survival"
        glow: true

      skyblock:
        slot: 13
        material: "OAK_SAPLING"
        name: "&b&lSkyBlock"
        lore:
          - "&7Construye tu isla flotante,"
          - "&7sube de nivel y lidera el top."
          - ""
          - "&e▶ Click para conectar"
        action: "CONNECT:skyblock"
        glow: true

      bedwars:
        slot: 15
        material: "RED_BED"
        name: "&c&lBedWars"
        lore:
          - "&7Protege tu cama y elimina"
          - "&7a los equipos rivales."
          - ""
          - "&e▶ Click para conectar"
        action: "CONNECT:bedwars"
        glow: true

      close:
        slot: 22
        material: "BARRIER"
        name: "&c&lCerrar"
        lore:
          - "&7Click para cerrar este menú."
        action: "CLOSE"

  # Menú de cosméticos
  cosmetics:
    title: "&8Menú de Cosméticos"
    rows: 4
    sound: "BLOCK_CHEST_OPEN"
    filler:
      enabled: true
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "
    items:
      # Partículas
      flame:
        slot: 10
        material: "BLAZE_POWDER"
        name: "&6&lHalo de Fuego"
        lore:
          - "&7Un anillo de llamas sobre tu cabeza."
          - ""
          - "&eClick para activar / desactivar"
        action: "COSMETIC_PARTICLE:flame"

      cloud:
        slot: 11
        material: "FEATHER"
        name: "&f&lNube Celestial"
        lore:
          - "&7Partículas de nube bajo tus pasos."
          - ""
          - "&eClick para activar / desactivar"
        action: "COSMETIC_PARTICLE:cloud"

      hearts:
        slot: 12
        material: "POPPY"
        name: "&c&lAura de Corazones"
        lore:
          - "&7Corazones flotando a tu alrededor."
          - ""
          - "&eClick para activar / desactivar"
        action: "COSMETIC_PARTICLE:hearts"

      magic:
        slot: 13
        material: "ENCHANTING_TABLE"
        name: "&9&lRunas Mágicas"
        lore:
          - "&7Runas galácticas que te rodean."
          - ""
          - "&eClick para activar / desactivar"
        action: "COSMETIC_PARTICLE:magic"

      portal:
        slot: 14
        material: "ENDER_EYE"
        name: "&5&lAura del End"
        lore:
          - "&7Energía oscura de portal dimensional."
          - ""
          - "&eClick para activar / desactivar"
        action: "COSMETIC_PARTICLE:portal"

      totem:
        slot: 15
        material: "TOTEM_OF_UNDYING"
        name: "&a&lChispas de Tótem"
        lore:
          - "&7Brillo legendario esmeralda y oro."
          - ""
          - "&eClick para activar / desactivar"
