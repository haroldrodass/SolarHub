name: SolarHub
version: '${version}'

main: dev.eychro.solarHub.SolarHub
api-version: '26.3'
load: POSTWORLD

authors: [ eychro ]

commands:
  solarhub:
    description: Comando principal de administración de SolarHub.
    usage: "§cUso correcto: /solarhub <help|reload>"

  discord:
    description: Muestra el enlace de Discord.
    usage: /<command>
    permission: Solar.Discord

  website:
    description: Muestra el enlace del sitio web.
    usage: /<command>
    permission: Solar.Website

  spawn:
    description: Teletransporta al jugador al spawn.
    usage: /<command>
    permission: Solar.Spawn

  buildmode:
    description: Activa o desactiva el modo de construcción.
    usage: /<command>
    permission: Solar.BuildMode

  setspawn:
    description: Establece la ubicación del spawn.
    usage: /<command>
    permission: Solar.SetSpawn

  fly:
    description: Vuela por el spawn
    usage: /<command>
    permission: Solar.Fly
    
  vanish:
    description: Hazte invisible para todos
    usage: /<command>
    permission: Solar.Vanish

permissions:
  Solar.CooldownBypass:
    description: Permite ignorar todos los cooldowns de comandos, doble salto y launchpad.
    default: op
  Solar.Discord:
    default: op
  Solar.Website:
    default: op
  Solar.Spawn:
    default: op
  Solar.DoubleJump:
    default: op
  Solar.LaunchPad:
    default: op
  Solar.JoinMessage:
    default: op
  Solar.BuildMode:
    default: op
  Solar.SetSpawn:
    default: op
  Solar.Admin:
    default: op
  Solar.Fly:
    default: op
  Solar.Vanish:
    default: op