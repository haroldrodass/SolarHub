#########################################################
#                                                       #
#                       Solar Hub                       #
#                                                       #
#                        Github:                        #
#        https://github.com/haroldrodass/SolarHub       #
#                                                       #
#########################################################
#
# GUÍA RÁPIDA DE FORMATOS
#
# Este archivo usa DOS formatos de color según el mensaje:
#
#  1) Códigos con "&" (mensajes de chat, listas de Discord/Website/Help):
#       &a = verde     &c = rojo      &e = amarillo   &6 = dorado
#       &b = celeste   &9 = azul      &7 = gris       &f = blanco
#       &8 = gris osc. &l = negrita   &m = tachado    &r = reiniciar
#
#  2) MiniMessage (SOLO Welcome-Title y Welcome-Subtitle):
#       <gold>texto</gold>                    color
#       <bold>texto</bold>                    negrita
#       <gradient:gold:yellow>texto</gradient> degradado
#       <#ff8800>texto                        color hexadecimal
#     No mezcles "&" con etiquetas <...> en el mismo mensaje.
#
# PLACEHOLDERS
#   %player%        Nombre del jugador (solo en JoinMessage)
#   <player>        Nombre del jugador (solo en Welcome-Title/Subtitle)
#   %link-discord%  Enlace de Discord (se toma de Config.yml)
#   %link-website%  Enlace de la web (se toma de Config.yml)
#
# NOTA: Después de editar, usa el comando de recarga del plugin
# (o reinicia el servidor) para aplicar los cambios.
#########################################################


# Prefijo que se añade al inicio de los mensajes de chat.
# NO se usa en los títulos de pantalla.
Prefix: "&6Solar&fHub &8->&f "


#########################################################
#                   MENSAJES GENERALES                  #
#########################################################

# El jugador no tiene permiso para usar el comando.
No-permission: "&cNo permission to do this."

# Un comando exclusivo para jugadores se ejecutó desde la consola.
OnlyPlayer: "&cOnly players can execute this command"

# Se recargó la configuración del plugin.
Reloaded: "&aPlugin Reloaded"

# Mensaje cuando una acción o comando está en tiempo de espera (cooldown).
# Placeholders: %cooldown%, %time%, %seconds%
Cooldown: "&cDebes esperar %cooldown% para usar esto de nuevo!"


#########################################################
#                     MODO CONSTRUCCIÓN                 #
#########################################################

# Mensajes al desactivar / activar el modo construcción.
DisableBuildMode: "&cBuild Mode Disabled"
EnableBuildMode: "&aBuild Mode Enabled"


#########################################################
#                     ENTRADA AL SERVER                 #
#########################################################

# Mensaje público cuando un jugador entra. Placeholder: %player%
JoinMessage: "%player% just joined the server."

# Título que aparece en pantalla al entrar (formato MiniMessage).
# Placeholder disponible: <player>
Welcome-Title: "<gradient:gold:yellow><bold>¡Bienvenido a SolarHub!</bold></gradient>"

# Subtítulo debajo del título (formato MiniMessage).
# Déjalo como "" si no quieres subtítulo. No uses null.
Welcome-Subtitle: "<gray>Disfruta tu estancia, <white><player>"


#########################################################
#                         SPAWN                         #
#########################################################

# Se guardó el spawn en las coordenadas del jugador.
SpawnSet: "&aSpawn set at your coordinates"

# Se intentó ir al spawn pero todavía no hay uno definido.
No-Spawn: "&cNo Spawn set"


#########################################################
#                          FLY                          #
#########################################################

FlyEnabled: "&aFly Enabled"
FlyDisabled: "&cFly Disabled"

#########################################################
#                       PARKOUR                         #
#########################################################

ParkourStart: "&a¡Parkour iniciado! - Cronómetro en marcha"
ParkourStarted: "&a¡Parkour iniciado! - Cronómetro en marcha"
ParkourCheckPoint: "&a¡Checkpoint alcanzado!"
ParkourFinish: "&a¡Has completado el parkour con éxito!"
ParkourTime: "&aTu tiempo final: &e%time%"
ParkourFall: "&c¡Has caído! Regresando al último checkpoint..."

#########################################################
#                        VANISH                         #
#########################################################

Vanished-Disabled: "&cVanish disabled"
Vanished-Enabled: "&aVanish enabled"

#########################################################
#                    ANNOUNCEMENTS                      #
#########################################################

Announcement:
  shop:
    - "&m                                                      "
    - ""
    - "&6&l¡Visita nuestra tienda en tienda.miservidor.com!"
    - "&e&lConsigue rangos y kits exclusivos en /shop"
    - ""
    - "&m                                                      "
  discord:
    - "&m                                                      "
    - ""
    - "&9&l¡Únete a nuestro Discord! discord.gg/tuinvite"
    - "&b&lEntérate de novedades y sorteos en Discord"
    - ""
    - "&m                                                      "
  website:
    - "&m                                                      "
    - ""
    - "&a&lVisita nuestra web: www.miservidor.com"
    - "&a&lEncuentra guías y reglas en nuestra página"
    - ""
    - "&m                                                      "
  discounts:
    - "&m                                                      "
    - ""
    - "&c&l¡50% de descuento en rangos este fin de semana!"
    - "&6&lUsa el código &eVERANO &6para un 20% extra"
    - ""
    - "&m                                                     "


################################################
#                                              #
#                     Redes                    #
#                                              #
################################################
# Estos mensajes son listas: cada línea "-" es una línea de chat.
# Una línea vacía ("") sirve como separador.
# "&8&m---" dibuja una línea divisoria tachada.

# Comando /discord. Usa %link-discord%.
Discord:
  - "&8&m                                          "
  - "               &9&lDiscord"
  - ""
  - " &7¡Únete a nuestra comunidad para estar al día!"
  - " &b%link-discord%"
  - ""
  - "&8&m                                          "

# Comando /website. Usa %link-website%.
Website:
  - "&8&m                                          "
  - "               &6&lWebsite"
  - ""
  - " &7¡Visita nuestra página oficial para más información!"
  - " &b%link-website%"
  - ""
  - "&8&m                                          "

# Comando /help. Puedes añadir o quitar líneas libremente.
Help:
  - "&8&m                                          "
  - "             &e&lSolar Hub &8| &fHelp"
  - ""
  - " &6/spawn &7- Teleport to the main spawn."
  - " &6/hub &7- Return to the lobby."
  - " &6/servers &7- Open server selector."
  - " &6/cosmetics &7- Open cosmetics menu."
  - " &6/profile &7- Open player profile."
  - " &6/fly &7- Toggle flight mode."
  - " &6/vanish &7- Hide yourself from other players."
  - " &6/discord &7- Join our community Discord."
  - " &6/website &7- Visit our official website."
  - ""
  - "&8&m                                          "

#########################################################
#                       HOTBAR                          #
#########################################################

HotbarReceived: "&aHas recibido los objetos de la barra rápida."
VisibilityEnabled: "&a¡Ahora todos los jugadores son visibles!"
VisibilityDisabled: "&c¡Ahora todos los jugadores están ocultos!"

#########################################################
#                        MENUS                          #
#########################################################

MenuNotFound: "&cEl menú '%menu%' no existe."
ConnectingServer: "&aConectando a &e%server%&a..."
CosmeticActivated: "&a¡Cosmético &e%cosmetic% &aactivado!"
CosmeticRemoved: "&c¡Cosmético(s) desactivado(s)!"
NoCosmeticsActive: "&eNo tienes ningún cosmético activo actualmente."

